# =====================================================================
# Configuration COMMUNE à tous les environnements.
# Les valeurs propres à la production sont dans application-prod.yaml,
# activé par la variable d'environnement SPRING_PROFILES_ACTIVE=prod.
# Aucun secret ici : ils viennent des variables d'environnement.
# =====================================================================

spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eduadvice}
    username: ${DB_USERNAME:eduadvice_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Le schéma est géré par Flyway (db/migration). Hibernate ne fait que
      # vérifier que les entités correspondent aux tables — il ne modifie rien.
      ddl-auto: validate
    open-in-view: false
    show-sql: false

server:
  # Les plateformes (Render, etc.) imposent le port via la variable PORT.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # On n'expose QUE ce qui est nécessaire (moindre privilège).
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness et /actuator/health/readiness
      probes:
        enabled: true
