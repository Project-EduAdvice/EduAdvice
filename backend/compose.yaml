services:
  postgres:
    image: postgres:18.6
    container_name: eduadvice-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: eduadvice_app
      POSTGRES_USER: eduadvice_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: