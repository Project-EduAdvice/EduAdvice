spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eduadvice}
    username: ${DB_USERNAME:eduadvice_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Le schéma est géré par Flyway (db/migration). Hibernate ne fait que
      # vérifier que les entités correspondent aux tables — il ne modifie rien.
      ddl-auto: validate
    open-in-view: false
    show-sql: false

server:
  port: 8080